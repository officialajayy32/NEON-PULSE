
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#170b35"/>
      <stop offset="100%" stop-color="#050316"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#ff36b7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <circle cx="256" cy="256" r="150"
          fill="none" stroke="#22d3ee"
          stroke-width="5" opacity=".3"/>

  <path d="M290 85 L170 270 H250 L215 425 L350 220 H270 Z"
        fill="url(#neon)"
        filter="url(#glow)"/>

  <circle cx="256" cy="256" r="185"
          fill="none" stroke="#ff36b7"
          stroke-width="3" opacity=".5"/>
</svg>
